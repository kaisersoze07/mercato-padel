<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Le Mercato Padel V2</title><style>:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#f5fbff;background:#0b1422}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#17394a,#0b1422 65%)}main{max-width:680px;margin:auto;padding:28px 18px 60px}header{text-align:center;margin-bottom:26px}.eyebrow{color:#65edbd;letter-spacing:.2em;font-weight:800;font-size:.75rem}h1{font-size:clamp(2.3rem,9vw,4rem);margin:8px 0;line-height:1.1}header p,.muted{color:#a9c0ce}.panel{border:1px solid #2d4856;border-radius:22px;background:#142638;padding:22px;margin:18px 0;box-shadow:0 12px 32px #0002}.pills{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.pill{background:#1b3847;border-radius:99px;padding:8px 12px;color:#cce5e8;font-size:.83rem}button{border:0;border-radius:12px;background:#66e7b4;color:#06231c;font-weight:800;font-size:1rem;padding:15px 18px;cursor:pointer;width:100%;margin-top:10px}button.secondary{background:#284253;color:#f2ffff}button:disabled{opacity:.45;cursor:not-allowed}.team{background:#1c3645;border:1px solid #355564;border-radius:14px;padding:15px;margin:10px 0;animation:pop .4s ease both}.team .tag{color:#6cf2bf;font-size:.75rem;font-weight:800;letter-spacing:.12em}.pair{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px;font-size:1.08rem;font-weight:800}.pair span{flex:1}.pair span:last-child{text-align:right}.pair b{color:#6cf2bf}.side{font-size:.72rem;color:#abc3ce;font-weight:400}.hidden{display:none!important}.locked{opacity:.65;text-align:center;color:#b0c5d0}.status{text-align:center;color:#9dbbc6;font-size:.9rem}.hint{font-size:.83rem;color:#a9c0ce;line-height:1.55}footer{text-align:center;color:#7e9aa8;font-size:.75rem;margin-top:28px}@keyframes pop{from{opacity:0;transform:translateY(15px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}label{display:block;margin:12px 0 6px;color:#cce5e8}select,textarea{width:100%;background:#203344;color:white;border:1px solid #456070;border-radius:10px;padding:12px;font:inherit}textarea{min-height:150px} .error{color:#ffb5a8}</style></head><body><main><header><div class="eyebrow">MONTANTE · DESCENDANTE · V2</div><h1>🎾 LE MERCATO</h1><p>Le tirage officiel de votre soirée padel</p><div class="pills" id="pills"></div></header><section class="panel" id="intro"><h2>🏆 Configure ta session</h2><label for="count">Nombre de joueurs</label><select id="count"></select><label for="mode">Mode de tirage</label><select id="mode"><option value="free">🔀 Mélange intégral</option><option value="position">Gauche + Droite</option></select><label for="names" id="namesLabel">Participants (un prénom par ligne)</label><textarea id="names" spellcheck="false"></textarea><div id="leftBox" class="hidden"><label for="left">Joueurs de gauche</label><textarea id="left"></textarea></div><p id="error" class="error" role="alert"></p><button id="draw">🎲 Effectuer un nouveau tirage</button><p class="hint">Partage le lien officiel après le tirage. Les participants verront les mêmes équipes, sans compte.</p></section><section class="panel hidden" id="results"><h2 id="heading">🎁 Révélation des équipes</h2><div id="teams"></div><button id="reveal">✨ Révéler l’équipe suivante</button><button id="all" class="secondary">Tout révéler</button><button id="share" class="hidden">📲 Partager le tirage officiel</button><button id="copy" class="secondary hidden">📋 Copier le lien officiel</button><button id="reset" class="secondary">↩️ Revenir à l’accueil</button><p id="status" class="status" aria-live="polite"></p></section><footer>LE MERCATO PADEL · V2 · Sans inscription</footer></main><script>
const R=['Cyril V','Cyril O','Kevin','Killian','Ulrich','Greg'],L=['Alexis','Guillaume Dj','Guillaume De','Yohann','Nico','Remy'];
const $=id=>document.getElementById(id), defaults=['Guillaume Dj','Killian','Cyril V','Greg','Ulrich','Remy','Nico','Kevin'];let pairs=[],shown=0,mode='free',official=false;
function legacy(){const m=new URLSearchParams(location.search).get('t');if(!m)return null;const parts=m.split('.');if(parts.length!==2)return null;const a=parts.map(x=>Number(x));if(a.some(x=>!Number.isInteger(x)||x<0||x>=720))return null;const perms=n=>{let pool=[0,1,2,3,4,5],out=[];for(let k=5;k>=0;k--){let fact=1;for(let i=2;i<=k;i++)fact*=i;const idx=Math.floor(n/fact);n%=fact;out.push(pool.splice(idx,1)[0])}return out};return perms(a[0]).map((v,i)=>[R[v],L[perms(a[1])[i]]])}

const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
for(let n=4;n<=16;n+=2){const o=document.createElement('option');o.value=n;o.textContent=n;$('count').append(o)}$('count').value=8;$('names').value=defaults.join('\n');
function config(){const pos=$('mode').value==='position';$('leftBox').classList.toggle('hidden',!pos);$('namesLabel').textContent=pos?'Joueurs de droite':'Participants (un prénom par ligne)';const n=Number($('count').value);pills(n,$('mode').value)}
function pills(n,m){$('pills').replaceChildren();for(const t of [n+' joueurs',n/2+' binômes',m==='position'?'Droite + Gauche':'Mélange intégral']){const e=document.createElement('div');e.className='pill';e.textContent=t;$('pills').append(e)}}
$('count').onchange=config;$('mode').onchange=config;config();
const names=id=>$(id).value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
function valid(p){return Array.isArray(p)&&p.length>=2&&p.length<=8&&p.every(t=>Array.isArray(t)&&t.length===2&&t.every(x=>typeof x==='string'&&x.trim()&&x.length<=80))&&new Set(p.flat().map(x=>x.toLowerCase())).size===p.length*2}
function link(){const u=new URL(location.href);u.search='';u.hash='v2='+encodeURIComponent(JSON.stringify({p:pairs,m:mode}));return u.href}
function paint(){const area=$('teams');area.replaceChildren();pairs.forEach((p,i)=>{const el=document.createElement('div');el.className='team'+(i>=shown?' locked':'');if(i<shown){const tag=document.createElement('div');tag.className='tag';tag.textContent='ÉQUIPE '+(i+1);const pair=document.createElement('div');pair.className='pair';const a=document.createElement('span'),b=document.createElement('span'),plus=document.createElement('b');a.textContent=p[0];b.textContent=p[1];plus.textContent='+';if(mode==='position'){for(const [e,t] of [[a,'Droite'],[b,'Gauche']]){const d=document.createElement('div');d.className='side';d.textContent=t;e.append(d)}}pair.append(a,plus,b);el.append(tag,pair)}else el.textContent='🔒 ÉQUIPE '+(i+1)+' · ??? + ???';area.append(el)});const done=shown===pairs.length;for(const id of ['reveal','all'])$(id).classList.toggle('hidden',done);for(const id of ['share','copy'])$(id).classList.toggle('hidden',!done);$('heading').textContent=done?'🏆 Les '+pairs.length+' équipes officielles':'🎁 Révélation des équipes';$('status').textContent=done?(official?'🔗 Tirage officiel partagé : mêmes équipes pour tous.':'Tirage terminé : partage le lien officiel.') :''}
function start(p,m,o=false){pairs=p;mode=m;official=o;shown=0;pills(p.length*2,m);$('intro').classList.add('hidden');$('results').classList.remove('hidden');paint()}
$('draw').onclick=()=>{const n=Number($('count').value),m=$('mode').value,a=names('names'),b=m==='position'?names('left'):[];if(a.length!==(m==='position'?n/2:n)||(m==='position'&&b.length!==n/2)){ $('error').textContent=m==='position'?'Indique '+n/2+' joueurs de chaque côté.':'Indique exactement '+n+' joueurs.';return}const x=shuffle(a),y=shuffle(b),p=m==='position'?x.map((v,i)=>[v,y[i]]):Array.from({length:n/2},(_,i)=>x.slice(i*2,i*2+2));if(!valid(p)){$('error').textContent='Utilise des noms distincts de 80 caractères maximum.';return}$('error').textContent='';start(p,m)};
$('reveal').onclick=()=>{shown=Math.min(pairs.length,shown+1);paint()};$('all').onclick=()=>{shown=pairs.length;paint()};$('share').onclick=async()=>{const url=link();if(navigator.share){try{await navigator.share({title:'Le Mercato Padel',text:'🎾 Voici les binômes officiels !',url});return}catch(e){if(e.name==='AbortError')return}}location.href='https://wa.me/?text='+encodeURIComponent('🎾 Le Mercato Padel : '+url)};$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(link());$('status').textContent='✅ Lien officiel copié !'}catch(e){prompt('Copie ce lien :',link())}};$('reset').onclick=()=>{history.replaceState(null,'',location.pathname);$('results').classList.add('hidden');$('intro').classList.remove('hidden');config()};
try{if(location.hash.startsWith('#v2=')){const d=JSON.parse(decodeURIComponent(location.hash.slice(4)));if(!valid(d.p)||!['free','position'].includes(d.m))throw Error();start(d.p,d.m,true)}else{const p=legacy();if(p)start(p,'position',true)}}catch(e){$('error').textContent='Lien de tirage invalide.'}
</script></body></html>
